    </main>
    <script>
        const img = document.querySelector('.photo img');
        if (!img.complete) {
            const timer = setTimeout(() => img.classList.add('loading'), 200);
            img.addEventListener('load', () => {
                clearTimeout(timer);
                img.classList.remove('loading');
            }, { once: true });
        }
    </script>
